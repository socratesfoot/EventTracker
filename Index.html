<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Calendar</title>
<style>
:root{--fg:#1d2333;--muted:#667085;--line:#e3e6ec;--soft:#f6f7f9;--today:#fff6d6}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--fg);background:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.top h1{font-size:26px;margin:0;letter-spacing:-.3px}
.nav{display:flex;gap:6px}
button{font:inherit;cursor:pointer}
.nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:600}
.nav button:hover{background:var(--soft)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.filters input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:180px;flex:1 1 180px;max-width:280px}
.chip{border:2px solid var(--c,#999);background:#fff;color:var(--c,#555);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700}
.chip.on{background:var(--c,#555);color:#fff}
.chip.all{--c:#344054}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{padding:6px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{aspect-ratio:1/1;min-height:0;overflow:hidden;padding:3px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.day.blank{background:var(--soft)}
.day.today{background:var(--today)}
.num{font-size:12px;font-weight:700;color:var(--muted);line-height:14px;flex:none}
.slots{flex:1;min-height:0;display:grid;gap:2px}
.slots.n1{grid-template-rows:1fr}
.slots.n2{grid-template-rows:1fr 1fr}
.slots.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.slots.list{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ev{border:2px solid var(--c);border-radius:5px;padding:0;background:#fff;text-align:left;overflow:hidden;width:100%;height:100%;min-height:0;min-width:0;display:flex;flex-direction:column}
.ev:hover{box-shadow:0 0 0 2px var(--c)}
.ev .t{flex:none;background:var(--c);color:#fff;font-size:11px;font-weight:700;line-height:1.15;padding:2px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ev .img{flex:1;min-height:0;position:relative;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--c);font-size:24px;font-weight:800}
.ev .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.n2 .ev{flex-direction:row}
.n2 .ev .img{flex:none;height:100%;aspect-ratio:1/1;font-size:16px}
.n2 .ev .t{flex:1;display:flex;align-items:center;font-size:10px;-webkit-line-clamp:unset}
.n4 .ev .t{font-size:8px;line-height:1.1;padding:1px 2px;-webkit-line-clamp:1}
.n4 .ev .img{font-size:14px}
.lk{flex:none;border:0;border-left:4px solid var(--c);background:var(--soft);text-align:left;padding:2px 4px;font-size:11px;font-weight:700;color:var(--c);text-decoration:underline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;border-radius:2px}
.lk:hover{background:#eceef2}
.empty{padding:18px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(20,24,36,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto;position:relative;border-top:8px solid var(--c)}
.modal .hero{width:100%;max-height:240px;object-fit:cover;display:block}
.modal .body{padding:18px 20px 22px}
.modal h2{margin:0 0 8px;font-size:32px;line-height:1.1;font-weight:900;letter-spacing:-.5px;overflow-wrap:anywhere}
.pill{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.info{margin:14px 0 4px;display:grid;gap:6px;font-size:16px}
.info b{font-weight:700}
.links{display:grid;gap:10px;margin-top:16px}
.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:var(--fg);border-radius:10px;padding:11px 14px;font-weight:700}
.btn.alt{background:var(--c)}
.btn.out{background:#fff;color:var(--fg);border:2px solid var(--fg)}
.rental{border:2px dashed var(--c);border-radius:10px;padding:10px 12px}
.rental small{display:block;color:var(--muted);margin:2px 0 8px}
.x{position:absolute;top:8px;right:10px;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:34px;height:34px;font-size:22px;line-height:1;z-index:2}
@media (max-width:640px){
  .top h1{font-size:21px}
  .day{padding:1px;gap:1px}
  .num{font-size:10px;line-height:11px}
  .ev .t{font-size:8px;padding:1px 2px;-webkit-line-clamp:1}
  .n2 .ev .t{font-size:8px;-webkit-line-clamp:2}
  .n4 .ev .t{display:none}
  .ev .img{font-size:12px}
  .lk{font-size:9px;padding:1px 2px;border-left-width:3px}
  .dow{font-size:10px;padding:4px 0}
  .modal h2{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title"></h1>
    <div class="nav">
      <button id="prev" aria-label="Previous month">&#8249; Prev</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Next month">Next &#8250;</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No events match this month. Try another month or clear the filters.</div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<script>
const DATA = <?!= dataJson ?>;
const PALETTE = ['#c92a2a','#1971c2','#2b8a3e','#862e9c','#d9480f','#0b7285','#a61e4d','#5f3dc4','#5c7f0a','#9c5b00','#364fc7','#495057'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $ = id => document.getElementById(id);

// ---- categories & colors (stable: alphabetical order) ----
const categories = [...new Set(DATA.events.map(e => e.category))].sort((a,b)=>a.localeCompare(b));
const colorOf = c => PALETTE[categories.indexOf(c) % PALETTE.length];

// ---- state ----
let cur = new Date(); cur.setDate(1); cur.setHours(0,0,0,0);
const active = new Set();
let query = '';

// ---- helpers ----
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { u = (u||'').trim(); if (u && !/^https?:\/\//i.test(u) && /^[\w-]+(\.[\w-]+)+/.test(u)) u = 'https://' + u; return /^https?:\/\//i.test(u) ? u : ''; };
const toDate = s => { const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const pad = n => String(n).padStart(2,'0');
const key = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtTime = t => { if (!t) return ''; const [h,m] = t.split(':').map(Number); return ((h%12)||12)+':'+pad(m)+' '+(h<12?'AM':'PM'); };
const fmtDate = s => toDate(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
function imgUrl(u){
  u = safeUrl(u); if (!u) return '';
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w600' : u;
}
function whenText(e){
  let s = fmtDate(e.start) + (e.startTime ? ' at ' + fmtTime(e.startTime) : '');
  if (e.end && e.end !== e.start) s += '  \u2192  ' + fmtDate(e.end) + (e.endTime ? ' at ' + fmtTime(e.endTime) : '');
  else if (e.endTime) s += ' \u2013 ' + fmtTime(e.endTime);
  return s;
}

// ---- filtering ----
function visibleEvents(){
  const q = query.toLowerCase();
  return DATA.events.filter(e =>
    (!active.size || active.has(e.category)) &&
    (!q || (e.name+' '+e.category+' '+e.property).toLowerCase().includes(q)));
}

// ---- filters UI ----
function buildFilters(){
  const f = $('filters'); f.innerHTML = '';
  const search = document.createElement('input');
  search.type = 'search'; search.placeholder = 'Search events or categories'; search.setAttribute('aria-label','Search events');
  search.addEventListener('input', () => { query = search.value.trim(); render(); });
  f.appendChild(search);
  const all = document.createElement('button');
  all.className = 'chip all' + (active.size ? '' : ' on'); all.textContent = 'All';
  all.onclick = () => { active.clear(); buildFilters(); render(); };
  f.appendChild(all);
  categories.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (active.has(c) ? ' on' : ''); b.textContent = c; b.style.setProperty('--c', colorOf(c));
    b.onclick = () => { active.has(c) ? active.delete(c) : active.add(c); buildFilters(); render(); };
    f.appendChild(b);
  });
  search.value = query;
}

// ---- calendar ----
function render(){
  const y = cur.getFullYear(), m = cur.getMonth();
  $('title').textContent = cur.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const byDay = {};
  visibleEvents().forEach(e => {
    const s = toDate(e.start); let en = e.end ? toDate(e.end) : s; if (en < s) en = s;
    for (let d = new Date(Math.max(s,first)); d <= en && d <= last; d.setDate(d.getDate()+1)) (byDay[key(d)] = byDay[key(d)] || []).push(e);
  });
  const g = $('grid'); g.innerHTML = '';
  DOW.forEach(n => { const d = document.createElement('div'); d.className = 'dow'; d.textContent = n; g.appendChild(d); });
  for (let i = 0; i < first.getDay(); i++) { const b = document.createElement('div'); b.className = 'day blank'; g.appendChild(b); }
  const todayKey = key(new Date()); let count = 0;
  for (let d = 1; d <= last.getDate(); d++) {
    const dt = new Date(y,m,d), k = key(dt);
    const cell = document.createElement('div'); cell.className = 'day' + (k === todayKey ? ' today' : '');
    const num = document.createElement('div'); num.className = 'num'; num.textContent = d; cell.appendChild(num);
    const list = (byDay[k] || []).slice().sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));
    if (list.length) {
      const slots = document.createElement('div');
      // 1 event: one box | 2: two half-height boxes | 3-4: four quarter boxes | 5+: text links
      slots.className = 'slots ' + (list.length > 4 ? 'list' : list.length === 3 ? 'n4' : 'n' + list.length);
      list.forEach(e => slots.appendChild(list.length > 4 ? link(e) : tile(e)));
      cell.appendChild(slots); count += list.length;
    }
    g.appendChild(cell);
  }
  while ((g.children.length - 7) % 7) { const b = document.createElement('div'); b.className = 'day blank'; g.appendChild(b); }
  $('empty').hidden = count > 0;
}

function link(e){
  const b = document.createElement('button');
  b.className = 'lk'; b.style.setProperty('--c', colorOf(e.category)); b.title = e.name;
  b.textContent = (e.startTime ? fmtTime(e.startTime).replace(' ','').toLowerCase() + ' ' : '') + e.name;
  b.onclick = () => openModal(e);
  return b;
}

function tile(e){
  const c = colorOf(e.category);
  const b = document.createElement('button');
  b.className = 'ev'; b.style.setProperty('--c', c); b.title = e.name;
  const t = document.createElement('div'); t.className = 't'; t.textContent = e.name;
  const box = document.createElement('div'); box.className = 'img';
  const fallback = () => { box.textContent = e.name.charAt(0).toUpperCase(); };
  const url = imgUrl(e.image);
  if (url) {
    const im = document.createElement('img'); im.loading = 'lazy'; im.alt = ''; im.referrerPolicy = 'no-referrer';
    im.onerror = () => { im.remove(); fallback(); }; im.src = url; box.appendChild(im);
  } else fallback();
  b.append(t, box);
  b.onclick = () => openModal(e);
  return b;
}

// ---- detail modal ----
function openModal(e){
  const c = colorOf(e.category), p = DATA.properties[(e.property||'').toLowerCase()];
  const venue = safeUrl(e.venueLink), tix = safeUrl(e.ticketLink), book = p ? safeUrl(p.link) : '', hero = imgUrl(e.image);
  const m = $('modal'); m.style.setProperty('--c', c);
  m.innerHTML =
    '<button class="x" aria-label="Close">&times;</button>' +
    (hero ? '<img class="hero" referrerpolicy="no-referrer" alt="" src="'+esc(hero)+'" onerror="this.remove()">' : '') +
    '<div class="body">' +
      '<h2>'+esc(e.name)+'</h2>' +
      '<span class="pill">'+esc(e.category)+'</span>' +
      '<div class="info"><div>\uD83D\uDCC5 '+esc(whenText(e))+'</div>' +
        (e.cost ? '<div><b>Cost:</b> '+esc(e.cost)+'</div>' : '') + '</div>' +
      '<div class="links">' +
        (venue ? '<a class="btn" href="'+esc(venue)+'" target="_blank" rel="noopener">Venue website</a>' : '') +
        (tix ? '<a class="btn alt" href="'+esc(tix)+'" target="_blank" rel="noopener">Buy tickets</a>' : '') +
        (book ? '<div class="rental"><b>Hospitality rental near venue</b><small>'+esc(p.name + (p.location ? ' \u2013 ' + p.location : ''))+'</small>' +
                '<a class="btn out" href="'+esc(book)+'" target="_blank" rel="noopener">Book this stay</a></div>' : '') +
      '</div></div>';
  m.querySelector('.x').onclick = closeModal;
  $('overlay').classList.add('open');
}
function closeModal(){ $('overlay').classList.remove('open'); }
$('overlay').addEventListener('click', ev => { if (ev.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

// ---- nav ----
$('prev').onclick = () => { cur.setMonth(cur.getMonth()-1); render(); };
$('next').onclick = () => { cur.setMonth(cur.getMonth()+1); render(); };
$('today').onclick = () => { cur = new Date(); cur.setDate(1); cur.setHours(0,0,0,0); render(); };

buildFilters(); render();
</script>
</body>
</html>
